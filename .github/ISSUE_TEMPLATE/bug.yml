name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands or code snippets.
      placeholder: |
        1. pnpm ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Output or error messages.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node and pnpm versions, and your OS.
      render: text
    validations:
      required: true
